        const sideHairL = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.26, 0.26), hairMat.clone());
        sideHairL.position.set(-0.3, 0.07, -0.02); headGroup.add(sideHairL);
        const sideHairR = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.26, 0.26), hairMat.clone());
        sideHairR.position.set(0.3, 0.07, -0.02); headGroup.add(sideHairR);
      }

      headGroup.rotation.x = 0.22;

      // ---- NECK COLLAR ----
      const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.14, 12), shirtMat.clone());
      collar.position.set(0, 1.80, 0.04); root.add(collar);
      const collarTop = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.05, 12), shirtMat.clone());
      collarTop.position.set(0, 1.88, 0.04); root.add(collarTop);

      // ---- SHOULDERS ----
      for (const side of [-1, 1]) {
        const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.19, 10, 8), suitMat.clone());
        shoulder.scale.set(0.8, 0.7, 0.9); shoulder.position.set(side * 0.44, 1.72, 0.04); shoulder.castShadow = true; root.add(shoulder);
      }

      // ---- ARMS WITH IK BONE LENGTHS & ARTICULATED FINGERS ----
      // Upper arm length: 0.62, Forearm + palm grip center length: 0.72 (local units)
      const UPPER_ARM_LEN = 0.74;
      const FORE_ARM_LEN = 1.04;

      const leftArmPivot = new THREE.Group();
      leftArmPivot.position.set(0.52, 1.68, 0.04); root.add(leftArmPivot);

      const lUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.13, UPPER_ARM_LEN, 10), suitMat.clone());
      lUpperArm.position.y = -UPPER_ARM_LEN / 2; lUpperArm.castShadow = true; leftArmPivot.add(lUpperArm);
      const lElbow = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), suitMat.clone());
      lElbow.position.y = -UPPER_ARM_LEN; leftArmPivot.add(lElbow);

      const leftForePivot = new THREE.Group();
      leftForePivot.position.y = -UPPER_ARM_LEN; leftArmPivot.add(leftForePivot);
      const lForeArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.11, 0.92, 10), suitMat.clone());
      lForeArm.position.y = -0.46; lForeArm.castShadow = true; leftForePivot.add(lForeArm);
      const lWrist = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), skinMat.clone());
      lWrist.position.y = -0.94; leftForePivot.add(lWrist);
      const lPalm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.09, 0.18), skinMat.clone());
      lPalm.position.y = -1.04; lPalm.castShadow = true; leftForePivot.add(lPalm);
      const lFingers = [];
      for (let f = 0; f < 4; f++) {
        const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.018, 0.09, 6), skinMat.clone());
        finger.position.set(-0.045 + f*0.03, -1.13, 0.04); leftForePivot.add(finger);
        lFingers.push(finger);
      }
      const lThumb = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.019, 0.07, 6), skinMat.clone());
      lThumb.rotation.z = -0.7; lThumb.position.set(0.1, -1.07, 0.03); leftForePivot.add(lThumb);

      const rightArmPivot = new THREE.Group();
      rightArmPivot.position.set(-0.52, 1.68, 0.04); root.add(rightArmPivot);
      const rUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.13, UPPER_ARM_LEN, 10), suitMat.clone());
      rUpperArm.position.y = -UPPER_ARM_LEN / 2; rUpperArm.castShadow = true; rightArmPivot.add(rUpperArm);
      const rElbow = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), suitMat.clone());
      rElbow.position.y = -UPPER_ARM_LEN; rightArmPivot.add(rElbow);

      const rightForePivot = new THREE.Group();
      rightForePivot.position.y = -UPPER_ARM_LEN; rightArmPivot.add(rightForePivot);
      const rForeArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.11, 0.92, 10), suitMat.clone());
      rForeArm.position.y = -0.46; rForeArm.castShadow = true; rightForePivot.add(rForeArm);
      const rWrist = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), skinMat.clone());
      rWrist.position.y = -0.94; rightForePivot.add(rWrist);
      const rPalm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.09, 0.18), skinMat.clone());
      rPalm.position.y = -1.04; rPalm.castShadow = true; rightForePivot.add(rPalm);
      const rFingers = [];
      for (let f = 0; f < 4; f++) {
        const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.018, 0.09, 6), skinMat.clone());
        finger.position.set(-0.045 + f*0.03, -1.13, 0.04); rightForePivot.add(finger);
        rFingers.push(finger);
      }
      const rThumb = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.019, 0.07, 6), skinMat.clone());
      rThumb.rotation.z = 0.7; rThumb.position.set(-0.1, -1.07, 0.03); rightForePivot.add(rThumb);

      // ---- SEATED LEGS ----
      for (const side of [-1, 1]) {
        const hipJoint = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), pantsBlack.clone());
        hipJoint.position.set(side * 0.22, 0.62, 0.08);
        root.add(hipJoint);

        const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.14, 0.66, 10), pantsBlack.clone());
        thigh.rotation.x = Math.PI / 2;
        thigh.position.set(side * 0.22, 0.62, 0.41);
        thigh.castShadow = true;
        root.add(thigh);

        const knee = new THREE.Mesh(new THREE.SphereGeometry(0.135, 8, 8), pantsBlack.clone());
        knee.position.set(side * 0.22, 0.62, 0.74);
        knee.castShadow = true;
        root.add(knee);

        const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.10, 0.56, 10), pantsBlack.clone());
        shin.position.set(side * 0.22, 0.34, 0.74);
        shin.castShadow = true;
        root.add(shin);

        const shoeMain = new THREE.Mesh(new THREE.BoxGeometry(0.21, 0.10, 0.36), shoeBlack.clone());
        shoeMain.position.set(side * 0.22, 0.05, 0.82);
        shoeMain.castShadow = true;
        root.add(shoeMain);

        const shoeToe = new THREE.Mesh(new THREE.SphereGeometry(0.105, 8, 6), shoeBlack.clone());
        shoeToe.scale.set(0.95, 0.5, 1.2);
        shoeToe.position.set(side * 0.22, 0.06, 0.98);
        root.add(shoeToe);
      }

      // Position & Orientation:
      // White (Bobby Fischer) sits at z = 10.6, rotated Math.PI so local +z points toward -z (facing the board & Carlsen).
      // Black (Magnus Carlsen) sits at z = -2.6, rotated 0 so local +z points toward +z (facing the board & Fischer).
      const SEAT_WORLD_Y = -3.02;
      if (isWhite) {
        root.position.set(4, SEAT_WORLD_Y, 10.0);
        root.rotation.y = Math.PI;
      } else {
        root.position.set(4, SEAT_WORLD_Y, -2.0);
        root.rotation.y = 0;
      }

      root.userData.seatedPosition = root.position.clone();
      return {
        root,
        torso,
        leftArmPivot,
        rightArmPivot,
        leftForePivot,
        rightForePivot,
        lFingers,
        rFingers,
        headGroup,
        upperArmLen: UPPER_ARM_LEN,
        foreArmLen: FORE_ARM_LEN,
        seatedPosition: root.position.clone(),
        reachOffset: new THREE.Vector3()
      };
    }

    const whitePlayer = buildPlayerModel(true);
    const blackPlayer = buildPlayerModel(false);
    scene.add(whitePlayer.root);
    scene.add(blackPlayer.root);

    // Add 3D tournament chairs positioned underneath each player
    const whiteChair = buildChairModel();
    whiteChair.position.set(4, 0, 10.0);
    whiteChair.rotation.y = Math.PI;
    scene.add(whiteChair);

    const blackChair = buildChairModel();
    blackChair.position.set(4, 0, -2.0);
    blackChair.rotation.y = 0;
    scene.add(blackChair);

    // ---- 2-BONE ANALYTICAL INVERSE KINEMATICS (IK) SOLVER ----
    // Solves shoulder and elbow rotations so the player's palm/hand lands accurately on `worldTargetPos`
    const _ikLocalTarget = new THREE.Vector3();
    const _ikToTarget = new THREE.Vector3();
    const _ikPoleDir = new THREE.Vector3();
    const _ikSideAxis = new THREE.Vector3();
    const _ikBendDir = new THREE.Vector3();
    const _ikElbowPos = new THREE.Vector3();
    const _ikUpperDir = new THREE.Vector3();
    const _ikForeDir = new THREE.Vector3();
    const _ikDownVec = new THREE.Vector3(0, -1, 0);
    const _ikQuatUpper = new THREE.Quaternion();
    const _ikQuatUpperInv = new THREE.Quaternion();
    const _ikQuatFore = new THREE.Quaternion();

    function reachHandToTarget(player, isRightArm, worldTargetPos, blend = 1.0, gripAmount = 0.0) {
      player.root.updateMatrixWorld(true);
      const shoulderPivot = isRightArm ? player.rightArmPivot : player.leftArmPivot;
      const forePivot = isRightArm ? player.rightForePivot : player.leftForePivot;
      const fingers = isRightArm ? player.rFingers : player.lFingers;

      // Convert world target into player root's local coordinate frame
      _ikLocalTarget.copy(worldTargetPos);
      player.root.worldToLocal(_ikLocalTarget);

      const shoulderOrigin = shoulderPivot.position;
      _ikToTarget.subVectors(_ikLocalTarget, shoulderOrigin);

      const L1 = player.upperArmLen;
      const L2 = player.foreArmLen;
      const maxReach = (L1 + L2) * 0.985;
      const minReach = Math.abs(L1 - L2) + 0.08;
      let d = _ikToTarget.length();
      if (d < 0.0001) return;

      const dir = _ikToTarget.clone().divideScalar(d);
      d = THREE.MathUtils.clamp(d, minReach, maxReach);
      const clampedTarget = shoulderOrigin.clone().addScaledVector(dir, d);

      // Pole vector points outward and slightly downward/backward so elbows bend naturally like a human chess player
      const outSign = isRightArm ? -1 : 1;
      _ikPoleDir.set(outSign * 0.85, -0.45, -0.35).normalize();

      // Project pole direction perpendicular to shoulder->target axis
      _ikSideAxis.crossVectors(dir, _ikPoleDir);
      if (_ikSideAxis.lengthSq() < 0.0001) {
        _ikSideAxis.set(0, 1, 0);
      } else {
        _ikSideAxis.normalize();
      }
      _ikBendDir.crossVectors(_ikSideAxis, dir).normalize();

      // Law of cosines for elbow triangle
      const cosAlpha = THREE.MathUtils.clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
      const sinAlpha = Math.sqrt(Math.max(0, 1 - cosAlpha * cosAlpha));

      // World/local elbow position
      _ikElbowPos.copy(shoulderOrigin)
        .addScaledVector(dir, L1 * cosAlpha)
        .addScaledVector(_ikBendDir, L1 * sinAlpha);

      // Upper arm orientation: local -Y aligns along (elbow - shoulder)
      _ikUpperDir.subVectors(_ikElbowPos, shoulderOrigin).normalize();
      _ikQuatUpper.setFromUnitVectors(_ikDownVec, _ikUpperDir);

      // Forearm orientation: local -Y aligns along (clampedTarget - elbow) inside upper arm's frame
      _ikForeDir.subVectors(clampedTarget, _ikElbowPos).normalize();
      _ikQuatUpperInv.copy(_ikQuatUpper).invert();
      _ikForeDir.applyQuaternion(_ikQuatUpperInv).normalize();
      _ikQuatFore.setFromUnitVectors(_ikDownVec, _ikForeDir);

      // Smoothly slerp into the target IK pose
      shoulderPivot.quaternion.slerp(_ikQuatUpper, blend);
      forePivot.quaternion.slerp(_ikQuatFore, blend);

      // Subtle finger curl when grasping a piece
      const targetFingerRotX = -0.15 - gripAmount * 0.55;
      for (let i = 0; i < fingers.length; i++) {
        fingers[i].rotation.x += (targetFingerRotX - fingers[i].rotation.x) * blend;
      }
    }

    // Move the player toward a distant target instead of allowing IK to clamp
    // the hand short of the piece. The torso rises when the target is far away.
    const _reachShoulderWorld = new THREE.Vector3();
    const _reachDeltaWorld = new THREE.Vector3();
    function movePlayerIntoReach(player, target, blend = 0.16) {
      player.root.updateMatrixWorld(true);
      const arm = player.rightArmPivot;
      arm.getWorldPosition(_reachShoulderWorld);
      _reachDeltaWorld.subVectors(target, _reachShoulderWorld);
      const horizontalDistance = Math.hypot(_reachDeltaWorld.x, _reachDeltaWorld.z);
      const safeReach = (player.upperArmLen + player.foreArmLen) * 2.25 * 0.88;
      const excess = Math.max(0, horizontalDistance - safeReach);
      const base = player.seatedPosition;
      const len = Math.max(0.001, horizontalDistance);
      const stepX = (_reachDeltaWorld.x / len) * excess;
      const stepZ = (_reachDeltaWorld.z / len) * excess;
      const stand = THREE.MathUtils.clamp(excess / 2.2, 0, 1);
      const desiredX = base.x + stepX;
      const desiredZ = base.z + stepZ;
      const desiredY = base.y + 0.72 * stand;
      player.root.position.x += (desiredX - player.root.position.x) * blend;
      player.root.position.z += (desiredZ - player.root.position.z) * blend;
      player.root.position.y += (desiredY - player.root.position.y) * blend;
      player.torso.rotation.x += ((0.08 + 0.16 * stand) - player.torso.rotation.x) * blend;
    }

    // Smoothly orient player's head toward a world point (piece or clock)
    const _headLocalLook = new THREE.Vector3();
    function aimHeadAtWorld(player, worldPos, blend = 0.14) {
      player.root.updateMatrixWorld(true);
      _headLocalLook.copy(worldPos);
      player.root.worldToLocal(_headLocalLook);
      const dx = _headLocalLook.x - player.headGroup.position.x;
      const dy = _headLocalLook.y - player.headGroup.position.y;
      const dz = Math.max(0.25, _headLocalLook.z - player.headGroup.position.z);

      const targetYaw = THREE.MathUtils.clamp(Math.atan2(dx, dz) * 0.65, -0.45, 0.45);
      const targetPitch = THREE.MathUtils.clamp(-Math.atan2(dy, dz) * 0.55, 0.08, 0.52);

      player.headGroup.rotation.y += (targetYaw - player.headGroup.rotation.y) * blend;
      player.headGroup.rotation.x += (targetPitch - player.headGroup.rotation.x) * blend;
      player.headGroup.rotation.z += (0 - player.headGroup.rotation.z) * blend;
    }

    // Smoothly relax arms back to natural seated resting pose
    const _restQuatLShoulder = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.22, 0, 0.14));
    const _restQuatRShoulder = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.22, 0, -0.14));
    const _restQuatFore = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.55, 0, 0));

    function smoothReturnToRest(player, blend = 0.14) {
      player.leftArmPivot.quaternion.slerp(_restQuatLShoulder, blend);
      player.leftForePivot.quaternion.slerp(_restQuatFore, blend);
      player.rightArmPivot.quaternion.slerp(_restQuatRShoulder, blend);
      player.rightForePivot.quaternion.slerp(_restQuatFore, blend);
      player.torso.rotation.x += (0.06 - player.torso.rotation.x) * blend;
      for (const f of player.lFingers) f.rotation.x += (0 - f.rotation.x) * blend;
      for (const f of player.rFingers) f.rotation.x += (0 - f.rotation.x) * blend;
    }

    // ---- SLIDING PIECE GROUP ----
    const slidePieceGroup = new THREE.Group();
    scene.add(slidePieceGroup);
    const capturedPiecesGroup = new THREE.Group();
    scene.add(capturedPiecesGroup);
    const captureTraySlots = [];
    let captureAnimation = null;
    let slidePieceMesh = null;
    let secondarySlideMesh = null; // For castling rook smooth movement

    // ---- SPEED CONTROL ----
    let gameSpeed = 1.0;
    document.getElementById('speed-slider').addEventListener('input', e => {
      gameSpeed = parseFloat(e.target.value);
      document.getElementById('speed-val').textContent = gameSpeed.toFixed(2).replace(/0+$/,'').replace(/\.$/,'') + 'x';
    });

    // ---- ANIMATION STATE ----
    let gameStarted = false;
    let animState = 'idle';
    let animTimer = 0;
    let moveAnim = null;
    let clockPressAnim = null;
    let frustrationAnim = null;

    function resetArmPoses() {
      whitePlayer.leftArmPivot.rotation.set(-0.22, 0, 0.14);
      whitePlayer.leftForePivot.rotation.set(-0.55, 0, 0);
      whitePlayer.rightArmPivot.rotation.set(-0.22, 0, -0.14);
      whitePlayer.rightForePivot.rotation.set(-0.55, 0, 0);
      whitePlayer.torso.rotation.set(0.06, 0, 0);
      whitePlayer.headGroup.rotation.set(0.22, 0, 0);
      for (const f of whitePlayer.lFingers) f.rotation.x = 0;
      for (const f of whitePlayer.rFingers) f.rotation.x = 0;

      blackPlayer.leftArmPivot.rotation.set(-0.22, 0, 0.14);
      blackPlayer.leftForePivot.rotation.set(-0.55, 0, 0);
      blackPlayer.rightArmPivot.rotation.set(-0.22, 0, -0.14);
      blackPlayer.rightForePivot.rotation.set(-0.55, 0, 0);
      blackPlayer.torso.rotation.set(0.06, 0, 0);
      blackPlayer.headGroup.rotation.set(0.22, 0, 0);
      for (const f of blackPlayer.lFingers) f.rotation.x = 0;
      for (const f of blackPlayer.rFingers) f.rotation.x = 0;

      clockButtons.white.position.y = clockButtonBaseY.white;
      clockButtons.black.position.y = clockButtonBaseY.black;
    }
    resetArmPoses();

    const _thinkQuatLShoulder = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.95, 0, -0.25));
    const _thinkQuatLFore = new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.35, 0, 0));
    const _thinkQuatRShoulder = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.95, 0, 0.25));
    const _thinkQuatRFore = new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.35, 0, 0));

    function applyThinkPoseSmooth(player, useLeftArm, blend = 0.1) {
      if (useLeftArm) {
        player.leftArmPivot.quaternion.slerp(_thinkQuatLShoulder, blend);
        player.leftForePivot.quaternion.slerp(_thinkQuatLFore, blend);
        player.rightArmPivot.quaternion.slerp(_restQuatRShoulder, blend);
        player.rightForePivot.quaternion.slerp(_restQuatFore, blend);
      } else {
        player.rightArmPivot.quaternion.slerp(_thinkQuatRShoulder, blend);
        player.rightForePivot.quaternion.slerp(_thinkQuatRFore, blend);
        player.leftArmPivot.quaternion.slerp(_restQuatLShoulder, blend);
        player.leftForePivot.quaternion.slerp(_restQuatFore, blend);
      }
    }

    // ---- OPENING HANDSHAKE ----
    let handshakeAnim = null;
    const handshakePoint = new THREE.Vector3(4, 2.15, 4);
    function beginHandshake() {
      handshakeAnim = { elapsed: 0, duration: 4.2 };
      whitePlayer.root.position.copy(whitePlayer.seatedPosition);
      blackPlayer.root.position.copy(blackPlayer.seatedPosition);
      whitePlayer.handshakeStretch = true;
      blackPlayer.handshakeStretch = true;
      whitePlayer.leftForePivot.scale.y = 1;
      blackPlayer.rightForePivot.scale.y = 1;
      animState = 'handshake';
      document.getElementById('turn-indicator').textContent = 'Players shaking hands...';
    }
    function updateHandshake(dt) {
      if (!handshakeAnim) return;
      handshakeAnim.elapsed += dt * gameSpeed;
      const t = Math.min(handshakeAnim.elapsed / handshakeAnim.duration, 1);
      const approach = THREE.MathUtils.smoothstep(t, 0.05, 0.42);
      const settle = 1 - THREE.MathUtils.smoothstep(t, 0.78, 1.0);
      const bob = t > 0.42 && t < 0.78 ? Math.sin((t - 0.42) / 0.36 * Math.PI * 4) * 0.045 : 0;
      // Rise from the chair and step toward the board rather than stretching
      // the arm unnaturally across the tabletop.
      whitePlayer.root.position.y = whitePlayer.seatedPosition.y + 1.10 * approach * settle;
      blackPlayer.root.position.y = blackPlayer.seatedPosition.y + 1.10 * approach * settle;
      whitePlayer.root.position.z = whitePlayer.seatedPosition.z - 2.85 * approach * settle;
      blackPlayer.root.position.z = blackPlayer.seatedPosition.z + 2.85 * approach * settle;
      const target = handshakePoint.clone();
      target.y += bob;
      // Both players' palms are driven to the exact same target, guaranteeing visible contact.
      reachHandToTarget(whitePlayer, false, target, 0.22 + approach * 0.78, 0.35);
      reachHandToTarget(blackPlayer, true, target, 0.22 + approach * 0.78, 0.35);
      aimHeadAtWorld(whitePlayer, target, 0.12);
      aimHeadAtWorld(blackPlayer, target, 0.12);
      whitePlayer.torso.rotation.x += (0.13 - whitePlayer.torso.rotation.x) * 0.12;
      blackPlayer.torso.rotation.x += (0.13 - blackPlayer.torso.rotation.x) * 0.12;
      if (t >= 1) {
        handshakeAnim = null;
        whitePlayer.root.position.copy(whitePlayer.seatedPosition);
        blackPlayer.root.position.copy(blackPlayer.seatedPosition);
        whitePlayer.handshakeStretch = false;
        blackPlayer.handshakeStretch = false;
        whitePlayer.leftForePivot.scale.y = 1;
        blackPlayer.rightForePivot.scale.y = 1;
        smoothReturnToRest(whitePlayer, 1);
        smoothReturnToRest(blackPlayer, 1);
        animState = 'white-think';
        animTimer = (1.8 + Math.random() * 1.8) / gameSpeed;
        document.getElementById('turn-indicator').textContent = "Fischer's turn";
      }
    }

    // ---- FRUSTRATION ANIMATION ----
    function triggerFrustrationAnimation(player) {
      frustrationAnim = {
        player,
        phase: 0,
        timer: 0,
        totalDuration: 2.8
      };
      animState = 'frustration';
    }

    function updateFrustrationAnim(dt) {
      if (!frustrationAnim) { animState = 'idle'; return; }
      const fa = frustrationAnim;
      fa.timer += dt * gameSpeed;
      const player = fa.player;
      const t = fa.timer * 6;

      if (fa.timer < 0.4) {
        const e = fa.timer / 0.4;
        player.leftArmPivot.rotation.set(-0.22 - 1.15 * e, 0, 0.14 - 0.45 * e);
        player.leftForePivot.rotation.set(-0.55 - 0.95 * e, 0, 0);
        player.rightArmPivot.rotation.set(-0.22 - 1.15 * e, 0, -0.14 + 0.45 * e);
        player.rightForePivot.rotation.set(-0.55 - 0.95 * e, 0, 0);
        player.headGroup.rotation.y = 0;
      } else if (fa.timer < 1.6) {
        const shake = Math.sin(t * 2.5) * 0.18;
        const nod = Math.abs(Math.sin(t * 1.5)) * 0.1;
        player.headGroup.rotation.y = shake;
        player.headGroup.rotation.x = 0.22 - nod;
        player.headGroup.rotation.z = shake * 0.3;
        player.leftArmPivot.rotation.x = -1.37 + Math.sin(t * 2.5) * 0.08;
        player.rightArmPivot.rotation.x = -1.37 + Math.sin(t * 2.5 + 0.5) * 0.08;
      } else if (fa.timer < 2.0) {
        const e = (fa.timer - 1.6) / 0.4;
        player.headGroup.rotation.x = 0.12 + e * 0.26;
        player.headGroup.rotation.y = 0;
        player.leftArmPivot.rotation.x = -1.37 + e * 1.15;
        player.rightArmPivot.rotation.x = -1.37 + e * 1.15;
        player.leftArmPivot.rotation.z = -0.31 + e * 0.45;
        player.rightArmPivot.rotation.z = 0.31 - e * 0.45;
      } else {
        const e = Math.min((fa.timer - 2.0) / 0.8, 1);
        player.leftArmPivot.rotation.x = -0.22;
        player.leftArmPivot.rotation.z = 0.14;
        player.leftForePivot.rotation.x = -1.5 + e * 0.95;
        player.rightArmPivot.rotation.x = -0.22;
        player.rightArmPivot.rotation.z = -0.14;
        player.rightForePivot.rotation.x = -1.5 + e * 0.95;
        player.headGroup.rotation.x = 0.38 - e * 0.16;
        player.headGroup.rotation.y = 0;
      }

      if (fa.timer >= fa.totalDuration) {
        frustrationAnim = null;
        resetArmPoses();
        animState = 'idle';
        if (!chess.isGameOver()) {
          const turn = chess.turn();
          animState = turn === 'w' ? 'white-think' : 'black-think';
          animTimer = (0.8 + Math.random() * 0.6) / gameSpeed;
          document.getElementById('turn-indicator').textContent = turn === 'w' ? "Fischer's turn" : "Carlsen's turn";
        }
      }
    }

    // ---- GAME STATE ----
    let chess = new Chess();
    let whiteTime = 600, blackTime = 600, baseTime = 600;
    let timerRunning = false;
    let activeClock = 'w';

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2,'0')}`;
    }

    function updateClockDisplay() {
      document.getElementById('side-time-white').textContent = formatTime(whiteTime);
      document.getElementById('side-time-black').textContent = formatTime(blackTime);
      document.getElementById('sc-white').classList.toggle('active', activeClock === 'w' && timerRunning);
      document.getElementById('sc-black').classList.toggle('active', activeClock === 'b' && timerRunning);
      document.getElementById('white-ind').textContent = activeClock === 'w' ? '●' : '';
      document.getElementById('black-ind').textContent = activeClock === 'b' ? '●' : '';
    }

    function startTimer() { timerRunning = true; }
    function stopTimer() { timerRunning = false; }

    function switchClock() {
      activeClock = activeClock === 'w' ? 'b' : 'w';
      if (!chess.isGameOver() && gameStarted) startTimer();
      else stopTimer();
      updateClockDisplay();
    }

    let clockDisplayAccum = 0;
    function tickClock(dt) {
      if (!timerRunning) return;
      if (activeClock === 'w') {
        whiteTime = Math.max(0, whiteTime - dt);
        if (whiteTime <= 0) { timerRunning = false; endGame('Carlsen wins on time!'); return; }
      } else {
        blackTime = Math.max(0, blackTime - dt);
        if (blackTime <= 0) { timerRunning = false; endGame('Fischer wins on time!'); return; }
      }
      clockDisplayAccum += dt;
      if (clockDisplayAccum >= 0.1) { clockDisplayAccum = 0; updateClockDisplay(); }
    }

    function endGame(reason) {
      stopTimer();
      document.getElementById('game-over-title').textContent = 'Game Over';
      document.getElementById('game-over-reason').textContent = reason;
      document.getElementById('game-over-overlay').classList.add('show');
      document.getElementById('turn-indicator').textContent = reason;
    }

    document.getElementById('play-again-btn').addEventListener('click', () => {
      document.getElementById('game-over-overlay').classList.remove('show');
      resetGame();
    });

    document.querySelectorAll('.time-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        baseTime = parseInt(btn.dataset.min) * 60;
        if (!gameStarted) { whiteTime = baseTime; blackTime = baseTime; updateClockDisplay(); }
      });
    });

    function resetGame() {
      chess = new Chess();
      whiteTime = baseTime; blackTime = baseTime;
      activeClock = 'w'; timerRunning = false;
      clockPressAnim = null; moveAnim = null; frustrationAnim = null;
      if (slidePieceMesh) { slidePieceGroup.remove(slidePieceMesh); slidePieceMesh = null; }
      if (secondarySlideMesh) { slidePieceGroup.remove(secondarySlideMesh); secondarySlideMesh = null; }
      capturedPiecesGroup.clear();
      captureTraySlots.length = 0;
      captureAnimation = null;
      animState = 'idle';
      moveQualities = [];
      if (quality3DSprite) { quality3DGroup.remove(quality3DSprite); quality3DSprite.material.map.dispose(); quality3DSprite.material.dispose(); quality3DSprite = null; }
      resetArmPoses();
      whitePlayer.root.position.copy(whitePlayer.seatedPosition);
      blackPlayer.root.position.copy(blackPlayer.seatedPosition);
      handshakeAnim = null;
      whitePlayer.handshakeStretch = false; blackPlayer.handshakeStretch = false;
      whitePlayer.leftForePivot.scale.y = 1; blackPlayer.rightForePivot.scale.y = 1;
      renderPiecesFromBoard();
      render2DBoards();
      updateMoveHistory();
      updateClockDisplay();
      startTimer();
      beginHandshake();
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      if (gameStarted) return;
      gameStarted = true;
      document.getElementById('start-btn').disabled = true;
      document.getElementById('start-btn').textContent = '✓ Game Started';
      document.querySelectorAll('.time-btn').forEach(b => b.style.pointerEvents = 'none');
      resetGame();
    });

    // ---- MOVE EXECUTION WITH FULL IK HAND-TO-PIECE SYNCHRONIZATION ----
    function executeMove(move) {
      if (!move) return;
      const fromRow = 8 - parseInt(move.from[1]);
      const fromCol = move.from.charCodeAt(0) - 97;
      const toRow = 8 - parseInt(move.to[1]);
      const toCol = move.to.charCodeAt(0) - 97;

      const madeMove = chess.move(move);
      if (!madeMove) return;

      const quality = evaluateMoveQuality(madeMove);
      moveQualities.push(quality);

      // Keep captured piece visible on the board until the moving piece arrives to displace it
      const isWhiteMove = madeMove.color === 'w';
      const player = isWhiteMove ? whitePlayer : blackPlayer;
      // Use right hand for White (closer to clock on +x side) and left hand for Black (closer to clock on +x side)
      const isRightArm = isWhiteMove;

      const fromKey = `${fromRow},${fromCol}`;
      const srcMesh = pieceMap.get(fromKey);
      if (srcMesh) {
        piecesGroup.remove(srcMesh);
        pieceMeshes = pieceMeshes.filter(p => p !== srcMesh);
        pieceMap.delete(fromKey);
      }

      if (slidePieceMesh) slidePieceGroup.remove(slidePieceMesh);
      if (secondarySlideMesh) { slidePieceGroup.remove(secondarySlideMesh); secondarySlideMesh = null; }

      // Create the piece at its starting square while the hand reaches out to grab it
      slidePieceMesh = createPieceMeshGroup(madeMove.piece, madeMove.color, fromRow, fromCol);
      const fwp = boardToWorld(fromRow, fromCol);
      const twp = boardToWorld(toRow, toCol);
      slidePieceMesh.position.set(fwp.x, PIECE_BASE_Y, fwp.z);
      slidePieceGroup.add(slidePieceMesh);

      // Handle castling rook smoothly too
      let rookData = null;
      if (madeMove.flags === 'k' || madeMove.flags === 'q') {
        const rRow = isWhiteMove ? 7 : 0;
        const rFromCol = madeMove.flags === 'k' ? 7 : 0;
        const rToCol = madeMove.flags === 'k' ? 5 : 3;
        const rKey = `${rRow},${rFromCol}`;
        const rMesh = pieceMap.get(rKey);
        if (rMesh) {
          piecesGroup.remove(rMesh);
          pieceMeshes = pieceMeshes.filter(p => p !== rMesh);
          pieceMap.delete(rKey);
        }
        secondarySlideMesh = createPieceMeshGroup('r', madeMove.color, rRow, rFromCol);
        const rfwp = boardToWorld(rRow, rFromCol);
        const rtwp = boardToWorld(rRow, rToCol);
        secondarySlideMesh.position.set(rfwp.x, PIECE_BASE_Y, rfwp.z);
        slidePieceGroup.add(secondarySlideMesh);
        rookData = { mesh: secondarySlideMesh, fromX: rfwp.x, fromZ: rfwp.z, toX: rtwp.x, toZ: rtwp.z };
      }

      // Handle en passant capture square
      let captureRow = toRow;
      let captureCol = toCol;
      if (madeMove.flags.includes('e')) {
        captureRow = isWhiteMove ? toRow + 1 : toRow - 1;
      }
      const capKey = `${captureRow},${captureCol}`;
      const capturedMesh = pieceMap.get(capKey) || null;

      const graspOffsetY = PIECE_GRASP_HEIGHTS[madeMove.piece] || (0.7 * BOARD_SCALE);

      moveAnim = {
        phase: 'reach-pickup', // 'reach-pickup' -> 'move-piece' -> 'release'
        progress: 0,
        player,
        isRightArm,
        mesh: slidePieceMesh,
        rookData,
        capturedMesh,
        capKey,
        fromRow, fromCol,
        toRow, toCol,
        fromX: fwp.x, fromZ: fwp.z,
        toX: twp.x, toZ: twp.z,
        graspOffsetY,
        isWhite: isWhiteMove,
        madeMove,
        quality,
        uiUpdated: false
      };

      animState = 'move-sequence';
      updateTurnIndicator();
    }

    // ---- CLOCK PRESS ANIMATION (Smooth IK Reach to Side Chess Clock) ----
    function startClockPressAnimation() {
      const isWhiteTurn = chess.turn() === 'w';
      const justMovedIsWhite = !isWhiteTurn;
      const player = justMovedIsWhite ? whitePlayer : blackPlayer;
      const isRightArm = justMovedIsWhite; // White's right arm and Black's left arm are on the +x side where the clock sits
      const buttonKey = justMovedIsWhite ? 'white' : 'black';

      const btnWorld = new THREE.Vector3();
      clockButtons[buttonKey].getWorldPosition(btnWorld);

      clockPressAnim = {
        player,
        isRightArm,
        buttonKey,
        btnWorld,
        progress: 0
      };
      animState = 'clock-press';
    }

    function updateTurnIndicator() {
      if (chess.isGameOver()) return;
      document.getElementById('turn-indicator').textContent = chess.turn() === 'w' ? "Fischer's turn" : "Carlsen's turn";
    }

    function updateMoveHistory() {
      const history = chess.history({ verbose: true });
      const moveListDiv = document.getElementById('move-list');
      if (history.length === 0) {
        moveListDiv.innerHTML = '<div style="color: #888; text-align: center; padding: 4px; font-style: italic;">No moves yet</div>';
        return;
      }
      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        const w = history[i], b = history[i+1];
        const wq = moveQualities[i] ? qualityConfig[moveQualities[i]] : null;
        const bq = moveQualities[i+1] ? qualityConfig[moveQualities[i+1]] : null;
        html += `<div class="move-item">
          <span class="move-number">${Math.floor(i/2)+1}.</span>
          <span class="move-white" style="color:${wq ? wq.color : '#fff'}">${w ? w.san : ''}</span>
          <span class="move-quality" style="color:${wq ? wq.color : '#fff'}">${wq ? wq.symbol : ''}</span>
          <span class="move-black" style="color:${bq ? bq.color : '#ffd966'}">${b ? b.san : ''}</span>
          <span class="move-quality" style="color:${bq ? bq.color : '#ffd966'}">${bq ? bq.symbol : ''}</span>
        </div>`;
      }
      moveListDiv.innerHTML = html;
      moveListDiv.scrollTop = moveListDiv.scrollHeight;
    }

    for (const id of ['white-elo', 'black-elo']) {
      const slider = document.getElementById(id);
      const output = document.getElementById(id + '-val');
      const syncElo = () => { output.textContent = String(slider.value); };
      slider.addEventListener('input', syncElo, { passive: true });
      slider.addEventListener('change', syncElo, { passive: true });
      slider.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
      slider.addEventListener('touchmove', e => e.stopPropagation(), { passive: true });
      slider.addEventListener('pointerdown', e => e.stopPropagation());
      slider.addEventListener('pointermove', e => { if (e.buttons) e.stopPropagation(); });
    }

    // ---- UI TOGGLE ----
    document.getElementById('toggle-board-btn').addEventListener('click', () => {
      const panel = document.getElementById('board-panel');
      panel.classList.toggle('expanded');
      document.getElementById('toggle-board-btn').textContent = panel.classList.contains('expanded') ? '⛶ Mini' : '⛶ Full';
      render2DBoards();
    });

    const sidebarToggle = document.getElementById('sidebar-toggle');
    let guiHidden = false;
    sidebarToggle.addEventListener('click', () => {
      guiHidden = !guiHidden;
      document.getElementById('info').classList.toggle('hidden', guiHidden);
      document.getElementById('side-clocks').classList.toggle('hidden', guiHidden);
      document.getElementById('board-panel').classList.toggle('hidden', guiHidden);
      sidebarToggle.classList.toggle('active', guiHidden);
    });

    // ---- SCENE DECOR: FLOOR, CHESS TABLE & LEGS ----
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x10121e, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.y = FLOOR_Y;
    ground.receiveShadow = true;
    scene.add(ground);

    const rug = new THREE.Mesh(
      new THREE.BoxGeometry(18, 0.04, 22),
      new THREE.MeshStandardMaterial({ color: 0x181c30, roughness: 0.95 })
    );
    rug.position.set(4.5, FLOOR_Y + 0.02, 4);
    rug.receiveShadow = true;
    scene.add(rug);

    // Proper Chess Table whose top surface sits at y = 0 (supporting board + side clock)
    const tableGroup = new THREE.Group();
    scene.add(tableGroup);

    const tableWoodMat = new THREE.MeshStandardMaterial({ color: 0x2a1b12, roughness: 0.45, metalness: 0.15 });
    const tableTrimMat = new THREE.MeshStandardMaterial({ color: 0xb8942a, roughness: 0.35, metalness: 0.65 });

    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(11.6, 0.36, 9.6), tableWoodMat);
    tableTop.position.set(4.4, -0.18, 4.0);
    tableTop.receiveShadow = true;
    tableTop.castShadow = true;
    tableGroup.add(tableTop);

    const tableEdgeTrim = new THREE.Mesh(new THREE.BoxGeometry(11.72, 0.10, 9.72), tableTrimMat);
    tableEdgeTrim.position.set(4.4, -0.18, 4.0);
    tableGroup.add(tableEdgeTrim);

    const tableApron = new THREE.Mesh(new THREE.BoxGeometry(10.2, 0.42, 8.2), tableWoodMat);
    tableApron.position.set(4.4, -0.55, 4.0);
    tableApron.castShadow = true;
    tableGroup.add(tableApron);

    const tableLegH = Math.abs(FLOOR_Y);
    const tableLegPositions = [
      [-0.7, -0.1],
      [ 9.5, -0.1],
      [-0.7,  8.1],
      [ 9.5,  8.1]
    ];
    for (const [tlx, tlz] of tableLegPositions) {
      const tLeg = new THREE.Mesh(new THREE.BoxGeometry(0.45, tableLegH, 0.45), tableWoodMat);
      tLeg.position.set(tlx, FLOOR_Y + tableLegH / 2, tlz);
      tLeg.castShadow = true;
      tLeg.receiveShadow = true;
      tableGroup.add(tLeg);

      const tFoot = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.14, 0.52), tableTrimMat);
      tFoot.position.set(tlx, FLOOR_Y + 0.07, tlz);
      tableGroup.add(tFoot);
    }

    // ---- INIT ----
    renderPiecesFromBoard();
    render2DBoards();
    updateMoveHistory();
    updateClockDisplay();

    // ---- ANIMATION LOOP ----
    const clock = new THREE.Clock();
    const _handTargetVec = new THREE.Vector3();
    const _lookTargetVec = new THREE.Vector3();

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (gameStarted) {
        if (animState === 'handshake') updateHandshake(dt);
        if (animState === 'frustration') {
          updateFrustrationAnim(dt);
        }

        // Animate captured pieces off the board into the visible side capture area.
        if (captureAnimation) {
          captureAnimation.progress = Math.min(1, captureAnimation.progress + dt * 1.8 * gameSpeed);
          const cp = easeInOutCubic(captureAnimation.progress);
          const arc = Math.sin(cp * Math.PI) * 0.85;
          captureAnimation.mesh.position.set(
            THREE.MathUtils.lerp(captureAnimation.from.x, captureAnimation.to.x, cp),
            THREE.MathUtils.lerp(captureAnimation.from.y, captureAnimation.to.y, cp) + arc,
            THREE.MathUtils.lerp(captureAnimation.from.z, captureAnimation.to.z, cp)
          );
          if (captureAnimation.progress >= 1) captureAnimation = null;
        }

        // ---- SYNCHRONIZED IK REACH -> PICKUP -> CARRY PIECE -> PLACE -> RELEASE ----
        if (animState === 'move-sequence' && moveAnim) {
          const ma = moveAnim;
          const otherPlayer = ma.isWhite ? blackPlayer : whitePlayer;
          smoothReturnToRest(otherPlayer, 0.1);

          // Relax non-reaching arm on the active player
          if (ma.isRightArm) {
            ma.player.leftArmPivot.quaternion.slerp(_restQuatLShoulder, 0.15);
            ma.player.leftForePivot.quaternion.slerp(_restQuatFore, 0.15);
          } else {
            ma.player.rightArmPivot.quaternion.slerp(_restQuatRShoulder, 0.15);
            ma.player.rightForePivot.quaternion.slerp(_restQuatFore, 0.15);
          }

          if (ma.phase === 'reach-pickup') {
            // Phase 1: Hand arcs smoothly from rest/thinking pose down onto the top of the source piece
            ma.progress += dt * 2.5 * gameSpeed;
            const p = Math.min(ma.progress, 1);
            const e = easeInOutCubic(p);

            // Slight forward torso lean when reaching across the board
            ma.player.torso.rotation.x += ((0.06 + 0.07 * e) - ma.player.torso.rotation.x) * 0.2;

            // Arc height so hand approaches piece cleanly from above without clipping neighboring pieces
            const arcLift = Math.sin(e * Math.PI) * 0.55;
            _handTargetVec.set(
              ma.fromX,
              PIECE_BASE_Y + ma.graspOffsetY + arcLift,
              ma.fromZ
            );

            // Close fingers as hand arrives on the piece
            const grip = p > 0.65 ? (p - 0.65) / 0.35 : 0;
            movePlayerIntoReach(ma.player, _handTargetVec, 0.20);
            reachHandToTarget(ma.player, ma.isRightArm, _handTargetVec, 0.42, grip);
            aimHeadAtWorld(ma.player, _handTargetVec, 0.16);

            if (p >= 1) {
              ma.phase = 'move-piece';
              ma.progress = 0;

              // Trigger 2D board slide right as the player lifts the piece!
              if (!ma.uiUpdated) {
                ma.uiUpdated = true;
                start2DSlide(ma.fromRow, ma.fromCol, ma.toRow, ma.toCol, ma.madeMove.piece, ma.madeMove.color, 520 / gameSpeed);
              }
            }
          } else if (ma.phase === 'move-piece') {
            // Phase 2: Lift piece slightly and transport smoothly to destination while hand stays locked onto piece!
            ma.progress += dt * 1.95 * gameSpeed;
            const p = Math.min(ma.progress, 1);
            const e = easeInOutCubic(p);

            const curX = ma.fromX + (ma.toX - ma.fromX) * e;
            const curZ = ma.fromZ + (ma.toZ - ma.fromZ) * e;
            // Knights hop slightly higher; sliding pieces lift smoothly over the board
            const liftPeak = ma.madeMove.piece === 'n' ? 0.65 : 0.42;
            const curY = PIECE_BASE_Y + Math.sin(e * Math.PI) * liftPeak;

            // Move the 3D piece mesh
            ma.mesh.position.set(curX, curY, curZ);

            // If castling, slide the rook simultaneously
            if (ma.rookData) {
              const rx = ma.rookData.fromX + (ma.rookData.toX - ma.rookData.fromX) * e;
              const rz = ma.rookData.fromZ + (ma.rookData.toZ - ma.rookData.fromZ) * e;
              ma.rookData.mesh.position.set(rx, PIECE_BASE_Y + Math.sin(e * Math.PI) * 0.25, rz);
            }

            // Lift the captured piece away and carry it to the capture area beside the table.
            if (ma.capturedMesh && p >= 0.72 && !ma.captureStarted) {
              ma.captureStarted = true;
              const captured = ma.capturedMesh;
              const start = captured.position.clone();
              piecesGroup.remove(captured);
              capturedPiecesGroup.add(captured);
              captured.position.copy(start);
              pieceMeshes = pieceMeshes.filter(pm => pm !== captured);
              pieceMap.delete(ma.capKey);
              const slot = captureTraySlots.length;
              const target = new THREE.Vector3(10.65 + (slot % 3) * 0.30, PIECE_BASE_Y, 3.0 + Math.floor(slot / 3) * 0.34);
              captureTraySlots.push(target.clone());
              captureAnimation = { mesh: captured, from: start, to: target, progress: 0 };
              ma.capturedMesh = null;
            }

            // Lock hand directly to the top of the moving piece every single frame!
            _handTargetVec.set(curX, curY + ma.graspOffsetY, curZ);
            movePlayerIntoReach(ma.player, _handTargetVec, 0.22);
            reachHandToTarget(ma.player, ma.isRightArm, _handTargetVec, 0.48, 1.0);
            aimHeadAtWorld(ma.player, _handTargetVec, 0.18);

            if (p >= 1) {
              // Snap piece cleanly onto destination square
              ma.mesh.position.set(ma.toX, PIECE_BASE_Y, ma.toZ);
              render2DBoards();
              updateMoveHistory();
              showQualityIndicator(ma.quality);
              show3DQualityBadge(ma.toRow, ma.toCol, ma.quality);

              if (chess.isGameOver()) {
                ma.phase = 'release';
                ma.progress = 0;
                setTimeout(() => {
                  let reason = chess.isCheckmate() ? 'Checkmate!' : chess.isDraw() ? 'Draw.' : chess.isStalemate() ? 'Stalemate.' : 'Game over.';
                  endGame(reason);
                }, 700 / gameSpeed);
              } else if (ma.quality === 'blunder' || ma.quality === 'mistake') {
                // Clean up temporary slide meshes and trigger blunder frustration
                if (slidePieceMesh) { slidePieceGroup.remove(slidePieceMesh); slidePieceMesh = null; }
                if (secondarySlideMesh) { slidePieceGroup.remove(secondarySlideMesh); secondarySlideMesh = null; }
                renderPiecesFromBoard();
                const blunderer = ma.player;
                moveAnim = null;
                triggerFrustrationAnimation(blunderer);
              } else {
                // Transition smoothly from placing the piece directly toward pressing the side clock!
                if (slidePieceMesh) { slidePieceGroup.remove(slidePieceMesh); slidePieceMesh = null; }
                if (secondarySlideMesh) { slidePieceGroup.remove(secondarySlideMesh); secondarySlideMesh = null; }
                renderPiecesFromBoard();
                moveAnim = null;
                stopTimer();
                document.getElementById('turn-indicator').textContent =
                  chess.turn() === 'w' ? "Fischer: Pressing clock..." : "Carlsen: Pressing clock...";
                startClockPressAnimation();
              }
            }
          } else if (ma.phase === 'release') {
            // Game-ending move: open fingers, lift hand off piece, and return to rest
            ma.progress += dt * 2.2 * gameSpeed;
            const p = Math.min(ma.progress, 1);
            if (p < 0.4) {
              _handTargetVec.set(ma.toX, PIECE_BASE_Y + ma.graspOffsetY + 0.45 * (p / 0.4), ma.toZ);
              reachHandToTarget(ma.player, ma.isRightArm, _handTargetVec, 0.35, 0.0);
            } else {
              smoothReturnToRest(ma.player, 0.16);
            }
            if (p >= 1) {
              ma.player.root.position.copy(ma.player.seatedPosition);
              ma.player.torso.rotation.x = 0.06;
              if (slidePieceMesh) { slidePieceGroup.remove(slidePieceMesh); slidePieceMesh = null; }
              if (secondarySlideMesh) { slidePieceGroup.remove(secondarySlideMesh); secondarySlideMesh = null; }
              renderPiecesFromBoard();
              moveAnim = null;
              animState = 'idle';
            }
          }
        }

        // ---- SMOOTH IK CLOCK PRESS ON SIDE OF BOARD ----
        if (animState === 'clock-press' && clockPressAnim) {
          clockPressAnim.progress += dt * 2.1 * gameSpeed;
          const p = Math.min(clockPressAnim.progress, 1);
          const ca = clockPressAnim;

          if (p < 0.45) {
            const bodyLean = THREE.MathUtils.smoothstep(p, 0, 0.45);
            ca.player.root.position.y += ((ca.player.seatedPosition.y + 0.48 * bodyLean) - ca.player.root.position.y) * 0.10;
            ca.player.root.position.z += (((ca.player === whitePlayer ? ca.player.seatedPosition.z - 0.72 : ca.player.seatedPosition.z + 0.72) * bodyLean + ca.player.seatedPosition.z * (1 - bodyLean)) - ca.player.root.position.z) * 0.10;
            // Arc hand from the destination square over to hover above the clock button
            const e = easeInOutCubic(p / 0.45);
            const arcY = 0.48 * Math.sin(e * Math.PI) + 0.14 * (1 - e);
            _handTargetVec.set(ca.btnWorld.x, clockButtonBaseY[ca.buttonKey] + 0.08 + arcY, ca.btnWorld.z);
            reachHandToTarget(ca.player, ca.isRightArm, _handTargetVec, 0.32, 0.1);
            aimHeadAtWorld(ca.player, ca.btnWorld, 0.16);
          } else if (p < 0.68) {
            // Depress clock button cleanly
            const e = (p - 0.45) / 0.23;
            const pressDepth = Math.sin(e * Math.PI) * 0.09;
            clockButtons[ca.buttonKey].position.y = clockButtonBaseY[ca.buttonKey] - pressDepth;
            _handTargetVec.set(ca.btnWorld.x, clockButtonBaseY[ca.buttonKey] + 0.05 - pressDepth, ca.btnWorld.z);
            reachHandToTarget(ca.player, ca.isRightArm, _handTargetVec, 0.65, 0.15);
            aimHeadAtWorld(ca.player, ca.btnWorld, 0.16);
          } else {
            // Smoothly withdraw hand back to resting pose and look back at the board
            clockButtons[ca.buttonKey].position.y = clockButtonBaseY[ca.buttonKey];
            smoothReturnToRest(ca.player, 0.18);
            _lookTargetVec.set(BOARD_CENTER.x, 0.5, BOARD_CENTER.z);
            aimHeadAtWorld(ca.player, _lookTargetVec, 0.12);
          }

          if (p >= 1) {
            ca.player.root.position.copy(ca.player.seatedPosition);
            ca.player.torso.rotation.x = 0.06;
            clockButtons[ca.buttonKey].position.y = clockButtonBaseY[ca.buttonKey];
            clockPressAnim = null;
            animState = 'idle';
            switchClock();
            if (!chess.isGameOver()) {
              const turn = chess.turn();
              animState = turn === 'w' ? 'white-think' : 'black-think';
              const pieceCount = chess.board().flat().filter(Boolean).length;
              const branching = chess.moves({ verbose: true }).length;
              const complexPosition = branching >= 24 || (pieceCount >= 20 && branching >= 18);
              animTimer = (complexPosition ? 3.2 + Math.random() * 2.8 : 1.1 + Math.random() * 1.0) / gameSpeed;
              document.getElementById('turn-indicator').textContent = turn === 'w' ? "Fischer's turn" : "Carlsen's turn";
            }
          }
        }

        if (animState === 'white-think' || animState === 'black-think') {
          animTimer -= dt * gameSpeed;
          const isWhiteTurn = animState === 'white-think';
          const player = isWhiteTurn ? whitePlayer : blackPlayer;
          const otherPlayer = isWhiteTurn ? blackPlayer : whitePlayer;
          const t = performance.now() * 0.0025 * gameSpeed;

          applyThinkPoseSmooth(player, isWhiteTurn, 0.1);
          smoothReturnToRest(otherPlayer, 0.1);
          player.headGroup.rotation.z = Math.sin(t) * 0.06;
          player.headGroup.rotation.x = 0.24 + Math.sin(t * 1.4) * 0.05;
          player.headGroup.rotation.y = Math.sin(t * 0.8) * 0.08;

          if (animTimer <= 0) {
            const moves = chess.moves({ verbose: true });
            if (moves.length > 0) {
              const chosen = chooseEloMove(chess, isWhiteTurn ? 'w' : 'b');
              executeMove(chosen);
            }
          }
        }

        if (animState === 'idle') {
          const t = performance.now() * 0.001 * gameSpeed;
          smoothReturnToRest(whitePlayer, 0.12);
          smoothReturnToRest(blackPlayer, 0.12);
          whitePlayer.headGroup.rotation.y = Math.sin(t * 0.4) * 0.04;
          blackPlayer.headGroup.rotation.y = Math.sin(t * 0.4 + 1.2) * 0.04;
        }
      }

      if (gameStarted) tickClock(dt);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      render2DBoards();
    });

    renderer.domElement.style.cursor = 'grab';
  </script>
</body>
</html>
